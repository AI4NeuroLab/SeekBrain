name: Windows CLI compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci --include=optional
      - name: Typecheck
        run: npm run typecheck
      - name: CLI and Windows runtime contracts
        env:
          SEEKBRAIN_TEST_WINDOWS_INSTALLER_E2E: '1'
        run: node --test tests/platform-runtime.mjs tests/bundled-tools.mjs tests/tool-package-selection.mjs tests/phase0-package-cli.mjs tests/setup-cli.mjs tests/windows-runtime.mjs tests/windows-installer.mjs
      - name: Python, subagent and PDF regressions
        run: npx --no-install vitest run tests/unit/dependency-install.test.ts tests/unit/existing-pi-agent-adapter.test.ts tests/unit/report-pdf-exporter.test.ts
