# Public SeekBrain defaults. Provider credentials and model selection are owned
# by Pi auth/model storage, environment variables, or project configuration.

paths: {}
literature:
  # Written explicitly by seekbrain setup. When absent, a configured legacy
  # Shanghai AI Lab base URL remains backward compatible; otherwise capabilities are off.
  providers: {}
modules:
  targeted_skill:
    # Minimum model/deterministic relevance score required to accept an existing analysis recipe.
    relevance_threshold: 0.5
    # Maximum number of existing analysis recipes accepted for one task.
    top_k: 1
    compatibility:
      candidate_pool_size: 10
      skill_top_k: 2
      prefer_repository: true
      paper_only_fallback: true
    resource_filter:
      suffixes: [".md", ".py"]
      max_files: 5

workflow:
  debug_disk_writes: false
  seekbrain:
    # Disable to bypass the lightweight data/question routing check.
    research_planning: true
    # Parent-level literature grounding before a Research Planning tree is generated.
    # This is independent from task/ordinary-run deep_research.
    research_survey: true
    # Run an automatic Reviewer Agent over a generated Research Planning tree.
    # Enabled by default; users can disable it in their user or project config.
    research_planning_peer_review: true
    # Used only by approved Research Planning trees; ordinary runs do not initialize it.
    research_execution:
      planning_concurrency: 3
      execution_concurrency: 2
    report:
      pdf:
        enabled: true
        command: seekbrain-pdf
        timeout_seconds: 120
    deep_research: false
    targeted_skill_match: true
    targeted_skill_generate: true
    # When enabled, a repository found by Paper RAG is immediately crystallized
    # into ~/.seekbrain/skills/from_rag/<github-owner>_<repository>/ and reused
    # whenever RAG finds the same repository again. Disabled by default so the
    # current repository-guidance -> Plan -> Code -> Validation flow is unchanged.
    rag_recipe_crystallization: false
    image_refine: false
    save_skill: true
    transparency: true
    human_review:
      enabled: true
      gates:
        plan: true
        code: false
        validate: false
        interpret: false

agents:
  seekbrain:
    thinking: low
    timeout_seconds: 5400
  seekbrain_default:
    thinking: off
    timeout_seconds: 300
  seekbrain_data_resolve:
    thinking: off
    timeout_seconds: 900
  seekbrain_research_route:
    thinking: off
    timeout_seconds: 120
  seekbrain_research_planning:
    thinking: high
    timeout_seconds: 300
  seekbrain_survey:
    thinking: low
    timeout_seconds: 600
    rag:
      paper_source: ailab_rag
      top_k: 4
      base_url: ""
      timeout: 600
      require_github: false
      source_char_limit: 5000
  seekbrain_research_reviewer:
    thinking: low
    timeout_seconds: 300
  seekbrain_deep_research:
    thinking: low
    timeout_seconds: 600
    rag:
      enable: false
      top_k: 4
      base_url: ""
      timeout: 600
      source_char_limit: 5000
  seekbrain_skill_match:
    thinking: off
    timeout_seconds: 300
  seekbrain_skill_context:
    thinking: off
    timeout_seconds: 900
  seekbrain_skill_generate:
    thinking: medium
    timeout_seconds: 900
  seekbrain_plan:
    thinking: high
    timeout_seconds: 300
  seekbrain_code:
    thinking: high
    timeout_seconds: 1800
    vision: false
  seekbrain_validate:
    thinking: low
    timeout_seconds: 300
    vision: true
  seekbrain_interpret:
    thinking: high
    timeout_seconds: 600
    vision: true
  seekbrain_report:
    thinking: low
    timeout_seconds: 900
    vision: true
  seekbrain_refine_image:
    thinking: off
    timeout_seconds: 1200
    vision: true
  seekbrain_save_skill:
    thinking: off

models: []
