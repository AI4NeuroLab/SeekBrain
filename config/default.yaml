# Public SeekBrain defaults. Provider credentials and model selection are owned
# by Pi auth/model storage, environment variables, or project configuration.

paths: {}
literature:
  # Written explicitly by seekbrain setup. When absent, a configured legacy
  # Shanghai AI Lab base URL remains backward compatible; otherwise capabilities are off.
  providers: {}
modules:
  targeted_skill:
    # V2 treats local RecipeCards and RAG Paper groups as first-class candidate
    # sources, then fairly expands repositories under a bounded inspection budget.
    resolution_mode: recipe_scout_v2
    # Minimum model/deterministic relevance score required to accept an existing analysis recipe.
    relevance_threshold: 0.6
    # Maximum size of the minimal, non-redundant Recipe set for one task.
    top_k: 3
    compatibility:
      candidate_pool_size: 10
      # Structured RecipeCard candidates exposed to the lightweight set selector.
      recipe_candidate_pool_size: 8
      skill_top_k: 2
      prefer_repository: true
      paper_only_fallback: true
      scout:
        rag_rounds: 2
        initial_rag_top_k: 8
        retry_rag_top_k: 4
        local_top_k: 8
        repository_inspections: 4
        initial_inspection_limit: 3
        inspection_concurrency: 2
        selected_methods: 2
    # One bounded trace-conditioned revision is allowed only for generated Recipes.
    revision:
      enabled: true
      budget: 1
      generated_only: true
    resource_filter:
      suffixes: [".md", ".py"]
      max_files: 5

workflow:
  debug_disk_writes: false
  seekbrain:
    # Controls web search, page fetching and cached web content; RAG is independent.
    web_search: true
    formulation_literature:
      search_result_limit: 4
      timeout_seconds: 600
      read_output_char_limit: 50000
    formulation_recipe:
      local_search_result_limit: 8
    # Disable to bypass the lightweight data/question routing check.
    research_planning: true
    # Selects standard hierarchical planning or the opt-in Creative Idea Card
    # session before the same hierarchical planning and execution workflow.
    research_planning_strategy: standard
    # Parent-level literature grounding before a Research Planning tree is generated.
    research_survey: true
    # Run an automatic Reviewer Agent over a generated Research Planning tree.
    # Enabled by default; users can disable it in their user or project config.
    research_planning_peer_review: true
    # Used only by approved Research Planning trees; ordinary runs do not initialize it.
    research_execution:
      planning_concurrency: 3
      execution_concurrency: 2
    report:
      pdf:
        # CLI --pdf / --no-pdf override this setting for the current invocation.
        enabled: true
        command: seekbrain-pdf
        timeout_seconds: 120
    # Deep Research mode: maximum rounds, including the first.
    deep_research:
      max_rounds: 3
    targeted_skill_match: true
    targeted_skill_generate: true
    # Legacy resolver only. RecipeScoutV2 always defers positive crystallization
    # until successful execution/validation or an explicit save.
    rag_recipe_crystallization: false
    image_refine: false
    save_skill: true
    transparency: true
    human_review:
      enabled: true
      gates:
        plan: true
        code: false
        validate: false
        interpret: false

agents:
  seekbrain:
    thinking: medium
    timeout_seconds: 5400
  seekbrain_default:
    thinking: off
    timeout_seconds: 300
  seekbrain_data_resolve:
    thinking: low
    timeout_seconds: 900
  # Lightweight semantic extraction before an ordinary analysis run. Research
  # Planning leaves use a deterministic adapter and do not invoke this agent.
  seekbrain_task_brief:
    thinking: off
    timeout_seconds: 120
  # One intake call extracts atomic Recipe requirements and decides whether
  # they form one pipeline or independent evidence workstreams.
  seekbrain_research_route:
    thinking: low
    timeout_seconds: 120
  seekbrain_research_planning:
    thinking: high
    timeout_seconds: 300
  seekbrain_survey:
    thinking: medium
    timeout_seconds: 600
    rag:
      paper_source: ailab_rag
      top_k: 4
      base_url: ""
      timeout: 600
      require_github: false
      source_char_limit: 5000
  seekbrain_research_reviewer:
    thinking: high
    timeout_seconds: 300
  seekbrain_skill_match:
    thinking: low
    timeout_seconds: 300
  seekbrain_recipe_scout_triage:
    thinking: low
    timeout_seconds: 180
  seekbrain_recipe_scout_finalize:
    thinking: low
    timeout_seconds: 300
  seekbrain_skill_context:
    thinking: off
    timeout_seconds: 900
  seekbrain_skill_generate:
    thinking: medium
    timeout_seconds: 900
  # Invoked at most once, only after Validation attributes a failure to a
  # generated Recipe and the normal Code retry path remains available.
  seekbrain_skill_revise:
    thinking: medium
    timeout_seconds: 600
  seekbrain_plan:
    thinking: high
    timeout_seconds: 1000
  seekbrain_formulation:
    thinking: high
    timeout_seconds: 600
  seekbrain_code:
    thinking: medium
    # Unified 0.1.4 Code/Validation have no whole-agent deadline.
    timeout_seconds: 0
    vision: false
  seekbrain_validate:
    thinking: medium
    timeout_seconds: 0
    vision: true
  seekbrain_interpret:
    thinking: high
    timeout_seconds: 600
    vision: true
    rag:
      top_k: 4
      timeout: 90
      # Keep enough returned full text for within-paper evidence retrieval, then
      # pass only the best bounded evidence windows to Interpretation.
      full_text_char_limit: 300000
      context_char_limit: 7000
  seekbrain_report:
    thinking: high
    timeout_seconds: 900
    vision: true
  seekbrain_refine_image:
    thinking: low
    timeout_seconds: 1200
    vision: true
  seekbrain_save_skill:
    thinking: off

models: []
