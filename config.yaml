# NeuroScientist Pi workflow config.
# Secrets stay in .env; generated Pi auth/models files stay under .pi/agent.

paths:
    # If omitted, root_dir defaults to the current Pi workspace/cwd.
    # root_dir: /path/to/project

    # If omitted, project_dir defaults to internagent/modules.
    # It is only needed if you intentionally want to override the Python source.
    # project_dir: /path/to/python/source

modules:
    targeted_skill:
        skill_dir: library/skills/trajectory
        generated_skill_output_dir: library/skills/from_rag
        skill_enable: true
        generate_skill_enable: true
        model: claude-opus-4-7
        top_k: 1
        relevance_threshold: 0.3
        temperature: 1.0
        rag_top_k: 2
        # Extra skill libraries scanned by the matcher in addition to skill_dir
        # (e.g. expert-saved skills). Best-scoring dir wins.
        extra_skill_dirs:
            - library/skills/from_expert

workflow:
    # Overrides internagent/workflow/agent_config.py WORKFLOW_DEFAULTS.
    # true = persist session logs, events, usage/, snapshots (debug); false = runtime deliverables only.
    debug_disk_writes: true
    level1:
        deep_research: false
        targeted_skill_match: true
        targeted_skill_generate: true
        image_refine: true
        image_analysis: true
        # Enable the /neuro-save-skill command (save a finished run as a reusable skill).
        save_skill: true
        # Show deep-research and targeted-skill content in the CLI (compact cards + /neuro-show).
        transparency: true
        # Interactive runs pause after enabled gates and wait for explicit human approval.
        # Non-interactive ./pi_run_level1.sh --non-interactive disables these gates at runtime.
        human_review:
            enabled: true
            gates:
                plan: true
                code: false
                validate: false
                conclude: false
    level2:
        # Show the paper-report subagent the referenced figure images so it writes
        # accurate panel-level legends (requires agents.level2_paper_report.vision: true).
        paper_report_vision: true
        # Deterministic lint: every key claim must cite a valid Figure/panel.
        report_lint: true
        # Optional LLM report reviewer (off by default).
        report_review: false
        # Export the final report to DOCX/PDF (best-effort; skipped with a warning
        # when no converter engine is available — paper_report.md is always written).
        export_docx: true
        export_pdf: true

agents:
    # Main Pi orchestrators.
    # Use the proxy provider for both Opus and Gemini so requests go through the shared relay.
    level1:
        provider: neuro-proxy
        model: claude-opus-4-7
        thinking: high
        timeout_seconds: 5400

    level2:
        provider: neuro-proxy
        model: claude-opus-4-7
        thinking: high
        timeout_seconds: 3600

    # Defaults for subagents. Most review/synthesis/helper agents follow the
    # reference config's default Gemini setting unless overridden below.
    level1_default:
        provider: neuro-proxy
        model: gemini-3.1-pro-preview
        thinking: high
        timeout_seconds: 300

    level2_default:
        provider: neuro-proxy
        model: gemini-3.1-pro-preview
        thinking: high
        timeout_seconds: 300

    # Level-1 pipeline agents, mapped from the reference config:
    # deep_research / plan_tool / code_tool / semantics_validate -> Opus 4.7;
    # image and conclusion helpers -> Gemini.
    level1_deep_research:
        provider: neuro-proxy
        model: claude-opus-4-7
        thinking: high
        timeout_seconds: 600
        rag:
            enable: true
            top_k: 4
            base_url: http://100.104.36.129:21800
            timeout: 600
            source_char_limit: 5000

    level1_plan:
        provider: neuro-proxy
        model: claude-opus-4-7
        thinking: high
        timeout_seconds: 300

    level1_code:
        provider: neuro-proxy
        model: claude-opus-4-7
        thinking: high
        timeout_seconds: 1800
        # Visual QA is handled once by level1_validate; the coder verifies
        # files and numerical outputs only.
        vision: false

    level1_validate:
        provider: neuro-proxy
        model: claude-opus-4-7
        thinking: high
        timeout_seconds: 300
        vision: true

    level1_refine_image:
        provider: neuro-proxy
        model: gemini-3.1-pro-preview
        thinking: high
        timeout_seconds: 1200
        vision: true

    level1_analyze_image:
        provider: neuro-proxy
        model: gemini-3.1-pro-preview
        thinking: high
        timeout_seconds: 300
        vision: true

    level1_conclude:
        provider: neuro-proxy
        model: gemini-3.1-pro-preview
        thinking: high
        timeout_seconds: 300
    level1_save_skill: {}

    # Level-2 decomposition/review/synthesis agents follow the reference config's
    # Gemini setting for subquestion/method/conclusion/report agents.
    level2_subquestion: {}
    level2_subquestion_review: {}
    level2_method_development: {}
    level2_method_review: {}
    level2_subagent_conclusion: {}
    level2_subagent_conclusion_review: {}
    level2_question_conclusion: {}
    # Vision on: the report agent is shown the figures to write panel legends.
    level2_paper_report:
        vision: true

# Extra or override models for built-in Anthropic/OpenAI-compatible providers.
# Provider base URLs and API keys come from .env.
models:
    - provider: openai
      id: gemini-3.1-pro-preview
      name: Gemini 3.1 Pro Preview
      reasoning: true
      vision: true
      context_window: 1000000
      max_tokens: 8192
      cost_input: 2.0
      cost_output: 12.0
      cost_cache_read: 0
      cost_cache_write: 0

    - provider: openai
      id: deepseek-v4-pro
      name: DeepSeek V4 Pro
      reasoning: true
      vision: false
      context_window: 1000000
      max_tokens: 65536
      cost_input: 0.438372
      cost_output: 0.876744
      cost_cache_read: 0.003653
      cost_cache_write: 0

    - provider: openai
      id: glm-5.2
      name: glm-5.2
      reasoning: true
      vision: false
      context_window: 1000000
      max_tokens: 32768
      cost_input: 1.169
      cost_output: 4.0915
      cost_cache_read: 0.292248
      cost_cache_write: 0
